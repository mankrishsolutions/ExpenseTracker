<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1">

        <title>Expense History</title>

        <link rel="stylesheet"
        href="../css/style.css">

        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    </head>
    <body>
        <header class="dashboard-header">

            <a href="../index.html"
               id="btnBack"
               class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="header-center">
                <h1 id="pageTitle">
                    Transactions
                </h1>
                <span class="fy-badge">
                    Expense History
                </span>
            </div>

        </header>
        <!-- Top Row -->
        <main class="dashboard-container">
            <div class="balance-card">
                <div class="balance-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span>Total Expense</span>
                <h2 id="lblTotalExpense">
                    ₹ 0
                </h2>
            </div>
            <div class="expense-summary">
                <div class="summary-box">
                    <div class="summary-icon cash-bg">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div class="summary-content">
                        <span>Cash</span>
                        <h3 id="lblCashExpense"></h3>
                    </div>
                </div>
                <div class="summary-box">
                    <div class="summary-icon online-bg">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <div class="summary-content">
                        <span>Online</span>
                        <h3 id="lblOnlineExpense"></h3>
                    </div>
                </div>
                <div class="summary-box">
                    <div class="summary-icon cc-bg">
                        <i class="fa-solid fa-credit-card"></i>
                    </div>
                    <div class="summary-content">
                        <span>Credit Card</span>
                        <h3 id="lblCCPayment"></h3>
                    </div>
                </div>
            </div>

            <div class="filters-panel">
                <input type="text"
                       id="txtSearch"
                       placeholder="🔍 Search Transactions">

                <div class="filter-row">
                    <select id="cmbMonth"></select>
                    <select id="cmbCategory"></select>
                    <select id="cmbMode"></select>
                </div>
            </div>
            <div id="entriesContainer"></div>
        </main>
        <div id="loadingOverlay" style="
	              position: fixed;
	              top: 0;
	              left: 0;
	              width: 100%;
	              height: 100%;
	              background: rgba(255,255,255,0.6);
	              display: flex;
	              align-items: center;
	              justify-content: center;
	              z-index: 9999;
	              display: none;">
            <img src="loading.gif" alt="Loading..." style="width: 150px; height: 150px;">
        </div>

        <script src="../js/config.js"></script>
        <script src="../js/masterdata.js"></script>
        <script src="../js/api.js"></script>
        <script src="../js/entries.js"></script>
        <script src="../js/navigation.js"></script>

    </body>
</html>
