<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Analytics</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/analytics.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

</head>

<body data-title="Analytics"
      data-subtitle="Monthly & Yearly Expense Insights"
      data-show-month="true">

    <!-- Header -->
    <div id="headerContainer"></div>

    <main class="dashboard-container">

        <section class="analytics-tabs">

            <button class="analytics-tab active"
                    data-tab="spending">

                <i class="bi bi-pie-chart-fill"></i>

                Spending

            </button>

            <button class="analytics-tab"
                    data-tab="accounts">

                <i class="bi bi-bank"></i>

                Accounts

            </button>

            <button class="analytics-tab"
                    data-tab="insights">

                <i class="bi bi-lightbulb-fill"></i>

                Insights

            </button>

        </section>

        <!-- ===================================== -->
        <!-- SUMMARY -->
        <!-- ===================================== -->
        <!-- ===================================== -->
        <!-- SUMMARY CARDS -->
        <!-- ===================================== -->

        <section class="summary-grid">

            <!-- Income -->
            <div class="summary-card income">
                <div class="summary-header">
                    <div class="summary-icon">
                        <i class="bi bi-wallet2"></i>
                    </div>
                    <div>
                        <div class="summary-title">
                            Income
                        </div>
                        <div class="summary-change positive"
                             id="incomeChange">
                            ↑ 0%
                        </div>
                    </div>
                </div>
                <div class="summary-value"
                     id="lblIncome">
                    ₹0
                </div>
                <canvas id="incomeSparkline"
                        class="sparkline"></canvas>
            </div>

            <!-- Expense -->

            <div class="summary-card expense">

                <div class="summary-header">

                    <div class="summary-icon">

                        <i class="bi bi-cash-stack"></i>

                    </div>

                    <div>

                        <div class="summary-title">

                            Expense

                        </div>

                        <div class="summary-change negative"
                             id="expenseChange">

                            ↓ 0%

                        </div>

                    </div>

                </div>

                <div class="summary-value"
                     id="lblExpense">

                    ₹0

                </div>

                <canvas id="expenseSparkline"
                        class="sparkline"></canvas>

            </div>

            <!-- Transactions -->

            <div class="summary-card transaction">

                <div class="summary-header">

                    <div class="summary-icon">

                        <i class="bi bi-receipt"></i>

                    </div>

                    <div>

                        <div class="summary-title">

                            Transactions

                        </div>

                        <div class="summary-change neutral"
                             id="transactionChange">

                            This Month

                        </div>

                    </div>

                </div>

                <div class="summary-value"
                     id="lblTransactions">

                    0

                </div>

                <canvas id="transactionSparkline"
                        class="sparkline"></canvas>

            </div>

            <!-- Average -->

            <div class="summary-card average">

                <div class="summary-header">

                    <div class="summary-icon">

                        <i class="bi bi-graph-up-arrow"></i>

                    </div>

                    <div>

                        <div class="summary-title">

                            Avg Daily

                        </div>

                        <div class="summary-change positive"
                             id="averageChange">

                            ↑ 0%

                        </div>

                    </div>

                </div>

                <div class="summary-value"
                     id="lblAverage">

                    ₹0

                </div>

                <canvas id="averageSparkline"
                        class="sparkline"></canvas>

            </div>

        </section>


        <!-- ===================================== -->
        <!-- ANALYTICS GRID -->
        <!-- ===================================== -->

        <section class="analytics-content">

            <div class="analytics-panel active" id="panelSpending">
                <!-- Expense Category -->

                <div class="analytics-card card-category">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi bi-pie-chart-fill"></i>
                            <h3>Expense by Category</h3>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="categoryChart"></canvas>
                    </div>

                </div>

                <!-- Payment Split -->

                <div class="analytics-card card-payment">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-credit-card-2-front-fill"></i>
                            <h3>Payment Split</h3>
                        </div>
                    </div>
                    <canvas id="paymentChart"></canvas>
                </div>

                <!-- Expense Trend -->

                <div class="analytics-card card-expense-trend">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-graph-up-arrow"></i>
                            <h3>Expense Trend</h3>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="expenseTrendChart"></canvas>
                    </div>


                </div>

                <!-- Monthly Comparison -->

                <div class="analytics-card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-bar-chart-fill"></i>
                            <h3>Monthly Comparison</h3>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="monthlyComparisonChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="analytics-panel" id="panelAccounts">
                <!-- Online Breakup -->

                <div class="analytics-card">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-bank"></i>
                            <h3>Online Breakup</h3>
                        </div>
                        <button class="card-action"
                                title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="onlineBreakupChart"></canvas>
                    </div>
                </div>

                <!-- Balance Distribution -->

                <div class="analytics-card card-expense-trend">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-wallet2"></i>
                            <h3>Balance Distribution</h3>
                        </div>
                        <button class="card-action"
                                title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="balanceDistributionChart"></canvas>
                    </div>
                </div>

                <!-- Balance History -->

                <div class="analytics-card large card-balance-history">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-clock-history"></i>
                            <h3>Balance History</h3>
                        </div>
                        <button class="card-action"
                                title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="balanceHistoryChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="analytics-panel" id="panelInsights">

                <!-- Top Categories -->

                <div class="analytics-card">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-award-fill"></i>
                            <h3>Top Categories</h3>
                        </div>
                        <button class="card-action"
                                title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div id="topCategories">
                    </div>
                </div>

                <!-- Top Expenses -->

                <div class="analytics-card">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-currency-rupee"></i>
                            <h3>Top Expenses</h3>
                        </div>
                        <button class="card-action"
                                title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <div id="topExpenses">
                    </div>

                </div>

                <!-- Category Trend -->

                <div class="analytics-card large card-category-trend">

                    <div class="card-header">
                        <div class="card-title">
                            <i class="bi-graph-up"></i>
                            <h3>Category Trend</h3>
                        </div>
                        <button class="card-action"
                                title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <canvas id="categoryTrendChart"></canvas>
                </div>


            </div>

        </section>



    </main>

    <!-- Common Scripts -->
    <script src="../js/common.js"></script>
    <script src="../js/masterdata.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/navigation.js"></script>
    <!--<script src="../js/transactions.js"></script>-->
    <script src="../js/config.js"></script>

    <!-- Analytics -->
    <script src="../js/analytics.js"></script>

</body>

</html>
