<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Add Transaction</title>

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>
	<header class="dashboard-header">
		<a href="../index.html"
		   id="btnBack"
		   class="back-btn">
			<i class="fa-solid fa-arrow-left"></i>
		</a>

		<div class="header-center">
			<h1 id="pageTitle">
				Transactions
			</h1>
			<span class="fy-badge">
				Add Transaction
			</span>
		</div>
	</header>

	<main class="dashboard-container">
		<div class="form-card">
			<form id="expenseForm">
				<div class="form-grid">
					<div class="form-group">
						<label>
							<i class="fa-solid fa-calendar"></i>
							Date
						</label>
						<input type="date"
							   id="txtDate">
					</div>
					<div class="form-group">
						<label>
							<i class="fa-solid fa-indian-rupee-sign"></i>
							Amount
						</label>
						<input type="number"
							   id="txtAmount"
							   placeholder="Enter Amount">
					</div>
					<div class="form-group">
						<label>
							<i class="fa-solid fa-file-lines"></i>
							Description
						</label>
						<input type="text"
							   id="txtDescription"
							   placeholder="Enter Description">
					</div>
					<div class="form-group">
						<label>
							<i class="fa-solid fa-layer-group"></i>
							Category
						</label>
						<select id="cmbCategory"></select>
					</div>
					<div class="form-group">
						<label>
							<i class="fa-solid fa-arrow-right-arrow-left"></i>
							Mode
						</label>
						<select id="cmbMode"></select>
					</div>

					<div class="form-group">
						<label>
							<i class="fa-solid fa-wallet"></i>
							Payment Medium
						</label>
						<select id="cmbPayment"></select>
					</div>
				</div>
				<div class="form-group">
					<label>
						<i class="fa-solid fa-note-sticky"></i>
						Remarks
					</label>
					<textarea id="txtRemarks"
							  rows="3"
							  placeholder="Optional Remarks"></textarea>
				</div>

				<button type="submit"
						class="save-btn">
					<i class="fa-solid fa-floppy-disk"></i>
					Save Transaction
				</button>
			</form>
			<div id="msgBox"></div>
		</div>
	</main>

	<div id="loadingOverlay" style="
	          position: fixed;
	          top: 0;
	          left: 0;
	          width: 100%;
	          height: 100%;
	          background: rgba(255,255,255,0.6);
	          display: flex;
	          align-items: center;
	          justify-content: center;
	          z-index: 9999;
	          display: none;">
		<img src="css/Loading.gif" alt="Loading..." style="width: 150px; height: 150px;">
	</div>

	<script src="../js/config.js"></script>
	<script src="../js/masterdata.js"></script>
	<script src="../js/api.js"></script>
	<script src="../js/add.js"></script>
	<script src="../js/navigation.js"></script>

</body>
</html>
