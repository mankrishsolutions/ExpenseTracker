<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<link rel="icon" type="image/x-icon" href="../favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#0B0F23" id="metaThemeColor">

	<title>Add / Edit Transaction</title>

	<!-- Apply the saved theme before the page paints (same setting as the other pages) -->
	<script>
		(function () {
			var theme = "dark";
			try { theme = localStorage.getItem("expenseTheme") || "dark"; } catch (e) { }
			document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
		})();
	</script>

	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/add.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet"
		  href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">

</head>

<body class="home-page add-page"
	  data-title="Add / Edit Transaction"
	  data-subtitle="Expense Entry"
	  data-show-month="false">

	<div id="headerContainer"></div>

	<main class="dashboard-container">

		<div class="form-card">

			<form id="expenseForm">

				<div id="transactionInfo" class="transaction-info" style="display:none;">
					<span class="label">Transaction ID :</span>
					<span id="lblTransactionId"></span>
				</div>
				<input type="hidden" id="txtTransactionId">

				<div class="form-grid">

					<div class="form-group fg-date">
						<label for="txtDate">
							<i class="fa-solid fa-calendar"></i>
							Date
						</label>
						<input type="date"
							   id="txtDate">
					</div>

					<div class="form-group fg-amount">
						<label for="txtAmount">
							<i class="fa-solid fa-indian-rupee-sign"></i>
							Amount
						</label>
						<div class="amount-wrap">
							<span class="rupee">₹</span>
							<input type="number"
								   id="txtAmount"
								   placeholder="0.00"
								   step="0.01"
								   min="0"
								   inputmode="decimal">
						</div>
					</div>

					<div class="form-group fg-desc">
						<label for="txtDescription">
							<i class="fa-solid fa-file-lines"></i>
							Description
						</label>
						<input type="text"
							   id="txtDescription"
							   placeholder="Enter Description">
					</div>

					<div class="form-group">
						<label for="cmbCategory">
							<i class="fa-solid fa-layer-group"></i>
							Category
						</label>
						<select id="cmbCategory"></select>
					</div>

					<div class="form-group">
						<label for="cmbMode">
							<i class="fa-solid fa-arrow-right-arrow-left"></i>
							Mode
						</label>
						<select id="cmbMode"></select>
					</div>

					<div class="form-group">
						<label for="cmbPayment">
							<i class="fa-solid fa-wallet"></i>
							Payment Medium
						</label>
						<select id="cmbPayment"></select>
					</div>

					<div class="form-group fg-remarks">
						<label for="txtRemarks">
							<i class="fa-solid fa-note-sticky"></i>
							Remarks
						</label>
						<textarea id="txtRemarks"
								  rows="3"
								  placeholder="Optional Remarks"></textarea>
					</div>

				</div>

				<button type="submit"
						class="save-btn">
					<i class="fa-solid fa-floppy-disk"></i>
					Save Transaction
				</button>

			</form>

		</div>

	</main>

	<div id="loadingOverlay" style="
	          position: fixed;
	          top: 0;
	          left: 0;
	          width: 100%;
	          height: 100%;
	          background: rgba(255,255,255,0.6);
	          display: flex;
	          align-items: center;
	          justify-content: center;
	          z-index: 9999;
	          display: none;">
		<img src="/components/loading.gif" alt="Loading..." style="width: 100px; height: 100px;">
	</div>

	<script src="../js/config.js"></script>
	<script src="../js/masterdata.js"></script>
	<script src="../js/common.js"></script>
	<!--<script src="../js/api.js"></script>-->
	<script src="../js/header.js"></script>

	<!-- Side rail / bottom bar navigation -->
	<script src="../js/navigation.js"></script>

	<!-- Page look: theme switch (display only) -->
	<script src="../js/home-ui.js"></script>

	<script src="../js/add.js"></script>

</body>
</html>
