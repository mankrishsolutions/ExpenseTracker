<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F23" id="metaThemeColor">

    <title>Expense Tracker</title>

    <!-- Apply the saved theme before the page paints (no light/dark flash).
         To change the default for a first visit, edit 'dark' below to 'light'. -->
    <script>
        (function () {
            var theme = "dark";
            try { theme = localStorage.getItem("expenseTheme") || "dark"; } catch (e) { }
            document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
        })();
    </script>

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/home.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Home page font (falls back to Segoe UI if offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">

    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body class="home-page"
      data-title="Expense Tracker"
      data-subtitle="FY 2026-27"
      data-show-month="true">

    <!-- Top row and navigation are built by js/shell.js -->
    <div id="headerContainer"></div>

    <main class="dashboard-container">

        <!-- ======================================
             ROW 1: Total expense + Available balance
        ====================================== -->
        <section class="r1">

            <div class="hp-panel exp-panel">

                <div class="exp-main">

                    <div class="hp-label">
                        Total expense &middot; <span id="lblSpentMonth">this month</span>
                    </div>

                    <div id="lblTotalExpense" class="hp-big">₹0</div>

                    <ul class="legend">
                        <li>
                            <span class="hp-dot dot-cash"></span>
                            <span class="lg-name">Cash</span>
                            <b id="lblCashExpense">₹0</b>
                            <small id="pctCash"></small>
                        </li>
                        <li>
                            <span class="hp-dot dot-online"></span>
                            <span class="lg-name">Online</span>
                            <b id="lblOnlineExpense">₹0</b>
                            <small id="pctOnline"></small>
                        </li>
                        <li>
                            <span class="hp-dot dot-card"></span>
                            <span class="lg-name">Card <em>(part of Online)</em></span>
                            <b id="lblCCPayment">₹0</b>
                            <small id="pctCard"></small>
                        </li>
                    </ul>

                </div>

                <div class="ring" aria-hidden="true">
                    <svg viewBox="0 0 120 120">
                        <circle class="ring-track" cx="60" cy="60" r="50"></circle>
                        <circle id="ringCash" class="ring-cash" cx="60" cy="60" r="50"
                                transform="rotate(-90 60 60)"></circle>
                        <circle id="ringOnline" class="ring-online" cx="60" cy="60" r="50"
                                transform="rotate(-90 60 60)"></circle>
                    </svg>
                    <div class="ring-center">
                        <b id="ringPct">0%</b>
                        <span>online</span>
                    </div>
                </div>

            </div>

            <div class="hp-panel bal-panel">

                <div class="bal-head">
                    <div>
                        <div class="hp-label">Available balance</div>
                        <div id="lblTotalBalance" class="hp-big">₹0</div>
                    </div>
                    <span id="chipVsOpening" class="hp-chip"></span>
                </div>

                <div id="balComp" class="comp" aria-hidden="true"></div>
                <div id="balLegend" class="comp-legend"></div>

            </div>

        </section>


        <!-- ======================================
             ACCOUNTS
        ====================================== -->
        <div class="sec-head">
            <h2>Accounts</h2>
            <span>balance vs opening balance (OB)</span>
        </div>

        <section class="tiles" id="accountTiles"></section>

        <!-- ======================================
             FILTERS + CATEGORIES   |   RECENT
        ====================================== -->
        <section class="r3">

            <div class="col-main">

                <div class="sec-head">
                    <h2>Where it went</h2>
                    <span id="lblCatCount"></span>
                </div>

                <div class="filters-panel">

                    <div class="filters-row r-a">

                        <div class="filter-item search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text"
                                   id="txtSearch"
                                   autocomplete="off"
                                   placeholder="Search transactions">
                        </div>

                        <button id="btnViewAll" class="action-btn" type="button">
                            <i class="fa-solid fa-table-list"></i>
                            <span class="btn-text">All transactions</span>
                        </button>

                    </div>

                    <div class="filters-row r-b">

                        <div class="seg-control" id="modeSeg" role="group" aria-label="Payment type">
                            <button type="button" class="on" data-group="">All</button>
                            <button type="button" data-group="CASH">Cash</button>
                            <button type="button" data-group="ONLINE">Online</button>
                            <button type="button" data-group="CARD">Card</button>
                        </div>

                        <div class="filter-item">
                            <i class="fa-solid fa-folder"></i>
                            <select id="cmbCategory" aria-label="Category"></select>
                        </div>

                        <div class="filter-item">
                            <i class="fa-solid fa-filter"></i>
                            <select id="cmbMode" aria-label="Account / mode"></select>
                        </div>

                    </div>

                </div>

                <div id="entriesContainer"></div>

            </div>

            <aside class="col-side">

                <div class="sec-head">
                    <h2>Recent</h2>
                    <span>latest 5</span>
                </div>

                <div id="recentList" class="hp-panel recent-panel"></div>

            </aside>

        </section>

        <!-- ==========================================
             View All Transactions Modal
        =========================================== -->

        <div id="allEntriesModal" class="custom-modal">

            <div class="custom-modal-content">

                <div class="custom-modal-header">

                    <h2>
                        <i class="fa-solid fa-table-list"></i>
                        All Transactions
                    </h2>

                    <button id="btnCloseEntriesModal" class="close-modal" type="button" aria-label="Close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                </div>

                <div class="custom-modal-body">

                    <div id="allEntriesTableContainer">

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
