<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body class="home-page"
      data-title="Expense Tracker"
      data-subtitle="FY 2026-27"
      data-show-month="true">

    <div id="headerContainer"></div>

    <main class="dashboard-container">

        <section class="balance-overview">
            <div class="balance-expense">
                <div class="balance-label">
                    Total Available Balance
                </div>
                <div id="lblTotalBalance"
                     class="balance-value">
                    ₹0
                </div>
            </div>


            <!--<div class="account-card cash">-->

            <div class="cash-info">

                <span>CRHD</span>
                <strong id="lblCRHD">
                    ₹0
                </strong>
                <small id="lblCRHDOpening" class="opening-balance">
                    OB ₹0
                </small>
            </div>

            <div class="cash-info">
                <span>CASH</span>
                <strong id="lblCash">
                    ₹0
                </strong>
                <small id="lblCashOpening" class="opening-balance">
                    OB ₹0
                </small>
            </div>


            <div class="balance-wallet">
                <i class="fa-solid fa-wallet"></i>
            </div>
        </section>

        <!-- Account Balances -->

        <h3 class="section-title">
            Available Balances
        </h3>

        <div class="balances-row">

            <div class="account-card crax">

                <div class="account-icon">
                    <i class="fa-solid fa-building-columns"></i>
                </div>

                <div class="account-info">

                    <span>CRAX</span>
                    <strong id="lblCRAX">
                        ₹0
                    </strong>
                    <small id="lblCRAXOpening" class="opening-balance">
                        OB ₹0
                    </small>
                </div>
            </div>

            <div class="account-card trhd">
                <div class="account-icon">
                    <i class="fa-solid fa-building-columns"></i>
                </div>
                <div class="account-info">
                    <span>TRHD</span>
                    <strong id="lblTRHD">
                        ₹0
                    </strong>
                    <small id="lblTRHDOpening" class="opening-balance">
                        OB ₹0
                    </small>
                </div>
            </div>

            <div class="account-card trpn">
                <div class="account-icon">
                    <i class="fa-solid fa-building-columns"></i>
                </div>

                <div class="account-info">

                    <span>TRPN</span>
                    <strong id="lblTRPN">
                        ₹0
                    </strong>
                    <small id="lblTRPNOpening" class="opening-balance">
                        OB ₹0
                    </small>
                </div>
            </div>

            <div class="account-card trcash">
                <div class="account-icon">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                </div>
                <div class="account-info">
                    <span>TRCASH</span>
                    <strong id="lblTRCASH">
                        ₹0
                    </strong>
                    <small id="lblTRCASHOpening" class="opening-balance">
                        OB ₹0
                    </small>
                </div>

            </div>

            <div class="account-card krhd">

                <div class="account-icon">
                    <i class="fa-solid fa-piggy-bank"></i>
                </div>
                <div class="account-info">
                    <span>KRHD</span>
                    <strong id="lblKRHD">
                        ₹0
                    </strong>
                    <small id="lblKRHDOpening" class="opening-balance">
                        OB ₹0
                    </small>
                </div>

            </div>

        </div>

        <div class="balance-card">

            <div class="balance-left">

                <div class="balance-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>

                <div>
                    <span>Total Expense</span>
                    <h2 id="lblTotalExpense">₹0</h2>
                </div>

            </div>

            <div class="expense-summary-inline">

                <div class="summary-item">
                    <i class="fa-solid fa-wallet cash-color"></i>
                    <div>
                        <span>Cash</span>
                        <h3 id="lblCashExpense"></h3>
                    </div>
                </div>

                <div class="summary-item">
                    <i class="fa-solid fa-building-columns online-color"></i>
                    <div>
                        <span>Online</span>
                        <h3 id="lblOnlineExpense"></h3>
                    </div>
                </div>

                <div class="summary-item">
                    <i class="fa-solid fa-credit-card cc-color"></i>
                    <div>
                        <span>Card</span>
                        <h3 id="lblCCPayment"></h3>
                    </div>
                </div>

            </div>

        </div>

        <div class="entries-actions">

            <button id="btnViewAll" class="action-btn">
                <i class="fa-solid fa-table-list"></i>
                All Transactions
            </button>

        </div>

        <div class="filters-panel">

            <div class="filter-item search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text"
                       id="txtSearch"
                       placeholder="Search Transactions">
            </div>

            <div class="filter-item">
                <i class="fa-solid fa-folder"></i>
                <select id="cmbCategory"></select>
            </div>

            <div class="filter-item">
                <i class="fa-solid fa-filter"></i>
                <select id="cmbMode"></select>

            </div>

        </div>


        <!-- ==========================================
     View All Transactions Modal
    =========================================== -->

        <div id="allEntriesModal" class="custom-modal">

            <div class="custom-modal-content">

                <div class="custom-modal-header">

                    <h2>
                        <i class="fa-solid fa-table-list"></i>
                        All Transactions
                    </h2>

                    <button id="btnCloseEntriesModal" class="close-modal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                </div>

                <div class="custom-modal-body">

                    <div id="allEntriesTableContainer">

                    </div>

                </div>

            </div>

        </div>

        <div id="entriesContainer"></div>

        <div id="loadingOverlay" style="
	          position: fixed;
	          top: 0;
	          left: 0;
	          width: 100%;
	          height: 100%;
	          background: rgba(255,255,255,0.6);
	          display: flex;
	          align-items: center;
	          justify-content: center;
	          z-index: 9999;
	          display: none;">
            <img src="loading.gif" alt="Loading..." style="width: 100px; height: 100px;">
        </div>

    </main>


    <script src="js/config.js"></script>
    <script src="js/header.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/entries.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
